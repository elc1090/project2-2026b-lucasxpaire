<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
</head>

<body>
    <div id="app-container">
        <header>
            <h1>Desafio: Lógica de Programação</h1>
            <input type="text" id="nickname" placeholder="Digite seu apelido">
            <button id="btn-submit">Enviar Resposta</button>
        </header>

        <main>
            <div id="blocklyDiv"></div>

            <xml id="toolbox" style="display: none">
                <category name="Lógica" colour="%{BKY_LOGIC_HUE}">
                    <block type="controls_if"></block>
                    <block type="logic_compare"></block>
                    <block type="logic_operation"></block>
                </category>
                <category name="Loops" colour="%{BKY_LOOPS_HUE}">
                    <block type="controls_repeat_ext">
                        <value name="TIMES">
                            <shadow type="math_number">
                                <field name="NUM">10</field>
                            </shadow>
                        </value>
                    </block>
                    <block type="controls_whileUntil"></block>
                </category>
                <category name="Matemática" colour="%{BKY_MATH_HUE}">
                    <block type="math_number"></block>
                    <block type="math_arithmetic"></block>
                </category>
            </xml>
        </main>
    </div>

    <script src="main.js"></script>
</body>

</html>
